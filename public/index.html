<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon-like MMO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby-container">
        <h1>Pokemon MMO</h1>
        <div class="lobby-controls">
            <button id="createRoomBtn">Create Room</button>
            <br><br>
            <input type="text" id="roomInput" placeholder="Room ID">
            <button id="joinRoomBtn">Join Room</button>
        </div>
        <p id="lobbyMessage"></p>
    </div>

    <div id="game-container" style="display: none; position: relative; width: 800px; height: 600px;">
        <div id="ui-overlay" style="display: none;">
            <div id="playerStats">
                Level: <span id="levelDisplay">1</span> | Exp: <span id="expDisplay">0</span>/<span id="expNeededDisplay">100</span>
            </div>
            <button id="gainExpBtn">Gain EXP!</button>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="battle-container" style="display: none;">
            <div id="battle-scene">
                <div class="health-box" id="wild-health">
                    <div id="wild-name-level">Wild Pokemon Lv.5</div>
                    <div class="hp-bar"><div class="hp-fill" id="wild-hp-fill"></div></div>
                </div>
                <img id="wild-sprite" src="" alt="Wild Pokemon">

                <img id="player-sprite" src="" alt="Your Pokemon">
                <div class="health-box" id="player-health">
                    <div id="player-name-level">Your Pokemon Lv.5</div>
                    <div class="hp-bar"><div class="hp-fill" id="player-hp-fill"></div></div>
                </div>
            </div>
            <div id="battle-menu">
                <div id="battle-message">A wild Pokemon appeared!</div>
                <div id="battle-actions">
                    <button id="btn-fight">Fight</button>
                    <button id="btn-catch">Catch</button>
                    <button id="btn-run">Run</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="pokemon.js"></script>
    <script src="game.js"></script>
</body>
</html>
